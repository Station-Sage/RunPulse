<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<title>오토파일럿 관제</title>
<style>
:root{--bg:#111827;--card:#1f2937;--fg:#f3f4f6;--mut:#9ca3af;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--acc:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding-bottom:64px}
header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:17px;margin:0}main{padding:0 12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0}.mut{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b1220}
nav button{flex:1;min-height:48px;background:none;border:0;color:var(--mut);font-size:15px}
nav button.on{color:var(--acc);border-top:2px solid var(--acc)}
button.b{min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:0;background:#374151;color:var(--fg);font-size:15px;margin:3px 3px 3px 0}
button.b.p{background:var(--acc);color:#0b1220}button.b.d{background:var(--bad);color:#0b1220}
input{min-height:44px;width:90px;border-radius:8px;border:1px solid #4b5563;background:#111827;color:var(--fg);padding:0 8px;font-size:15px}
.bar{height:8px;background:#374151;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.tag{display:inline-block;padding:0 8px;border-radius:8px;background:#374151;font-size:12px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;color:var(--mut);margin:0}
.opt{border:1px solid #374151;border-radius:10px;padding:8px;margin:6px 0}.pro{color:var(--ok)}.con{color:var(--bad)}
#msg{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#065f46;padding:8px 14px;border-radius:10px;display:none;z-index:9}
.hid{display:none}
</style></head><body>
<header><h1>오토파일럿 관제</h1><span class="mut" id="upd">-</span></header>
<div id="msg"></div>
<main>
<section id="t-now">
 <div class="card" id="st"></div>
 <div class="card" id="qu"></div>
 <div class="card" id="bu"></div>
</section>
<section id="t-ctl" class="hid">
 <div class="card"><b>실행 제어</b><div class="mut" id="flags"></div>
  <button class="b p" data-a="start">시작</button><button class="b p" data-a="resume">재개</button>
  <button class="b" data-a="pause">일시중지</button><button class="b d" data-a="stop">중지</button>
  <div class="mut">일시중지 = 현재 단계를 마치고 다음 단계부터 멈춤 · 중지 = 즉시 종료(등록된 프로세스 회수)</div></div>
 <div class="card"><b>자동 재개 타이머</b><div id="tm"></div>
  <div class="mut">간격(분, 10~1440)</div>
  <div id="tmset"></div></div>
 <div class="card"><b>한도 설정</b><div id="tun"></div></div>
 <div class="card"><b>진행 로그</b><pre id="log"></pre></div>
</section>
<section id="t-dec" class="hid"><div id="dl"></div></section>
<section id="t-rev" class="hid"><div id="rv"></div></section>
</main>
<nav><button data-t="now" class="on">현황</button><button data-t="ctl">제어</button><button data-t="dec">결정<span id="dn"></span></button><button data-t="rev">검토</button></nav>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TUN={AUDIT_TOOL_CALLS_PER_ROUND:'감사 라운드당 도구 호출',FALLBACK_SESSION_MAX_RUNS:'세션 최대 실행 수',FALLBACK_SESSION_MAX_USD:'세션 최대 비용($)'};
let timers={},tab='now',typing=false;
async function api(p,body){
 const o=body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{};
 const r=await fetch(p,o);let j={};try{j=await r.json()}catch(e){}
 if(!r.ok&&body)toast(j.error||j.reason||'실패 '+r.status,true);return j}
function toast(t,bad){const m=$('#msg');m.textContent=t;m.style.background=bad?'#7f1d1d':'#065f46';m.style.display='block';setTimeout(()=>m.style.display='none',2500)}
function fmt(ts){return ts?new Date(ts*1000).toLocaleString('ko-KR',{hour12:false}):'-'}
function left(us){const t=Number(us)/1e6;if(!t)return'-';const s=Math.round(t-Date.now()/1000);if(s<=0)return'곧 실행';return Math.floor(s/60)+'분 '+s%60+'초 후'}
function pct(a,b){return b?Math.min(100,Math.round(100*a/b)):0}
function bar(l,a,b){return `<div class="row"><span>${l}</span><span>${a} / ${b}</span></div><div class="bar"><i style="width:${pct(a,b)}%"></i></div>`}
function renderNow(o){
 const s=o.state,f=o.flags;
 $('#upd').textContent=new Date().toLocaleTimeString('ko-KR',{hour12:false});
 $('#st').innerHTML=`<b>루프 상태</b> <span class="tag">${esc(s.phase||'-')}</span>${f.pause?' <span class="tag" style="color:var(--warn)">일시중지</span>':''}${f.stop?' <span class="tag" style="color:var(--bad)">중지</span>':''}
 <div class="row"><span>라운드 / 단위</span><span>${esc(s.round)} / ${esc(s.unit)}</span></div>
 <div class="row"><span>완료 단위 · 실패</span><span>${esc(s.units_done)} · ${esc(s.fails)}</span></div>
 ${s.stop_reason?`<div class="mut">중단 사유: ${esc(s.stop_reason)}</div>`:''}`;
 const q=o.queue,b=q.by_stage;
 $('#qu').innerHTML=`<b>큐 (자동 ${q.total}건)</b><div>${Object.entries(b).map(([k,v])=>`<span class="tag">${k} ${v}</span> `).join('')}</div>
 <div class="mut">다음 실행: ${esc(q.next||'없음')}</div>`+q.attention.filter(a=>a.stage!=='review').map(a=>`<div class="row"><span>${esc(a.id)} <span class="tag">${a.stage}</span></span></div><div class="mut">${esc(a.text)}</div>`).join('');
 const g=o.budget;
 $('#bu').innerHTML=`<b>예산·페이싱</b>${bar('오늘($)',g.today_usd,g.daily_max)}${bar('이번 주($)',g.week_usd,g.weekly_max)}
 <div class="mut">${g.pacing_ok?'진행 가능':'대기: '+esc(g.pacing_reason)+(g.pacing_resume_at?' · 재개 '+fmt(g.pacing_resume_at):'')}</div>`;
 $('#flags').textContent=`PAUSE ${f.pause?'ON':'off'} · STOP ${f.stop?'ON':'off'}`;
 $('#dn').textContent=o.decisions_open?` (${o.decisions_open})`:'';
 const rv=q.attention.filter(a=>a.stage==='review');
 $('#rv').innerHTML=rv.length?rv.map(a=>`<div class="card"><b>${esc(a.id)}</b> <span class="tag">사후 검토</span><div class="mut">${esc(a.text)}</div></div>`).join(''):'<div class="card mut">검토 대기 항목 없음</div>';
}
function renderTimers(){
 $('#tm').innerHTML=Object.entries(timers).map(([k,v])=>`<div class="row"><span>${k.replace('runpulse-','')} <span class="tag">${esc(v.active||'?')}</span></span><span data-next="${esc(v.next||0)}"></span></div>`).join('');
 tickTimers()}
function tickTimers(){document.querySelectorAll('[data-next]').forEach(e=>{e.textContent=left(Number(e.dataset.next)*1e6)})}
function buildSettings(){
 $('#tmset').innerHTML=['runpulse-audit','runpulse-watch'].map(t=>`<div class="row"><span>${t.replace('runpulse-','')}</span><span><input type="number" min="10" max="1440" placeholder="분" id="iv-${t}"><button class="b" data-iv="${t}">적용</button></span></div>`).join('');
 $('#tun').innerHTML=Object.entries(TUN).map(([k,l])=>`<div class="row"><span>${l}</span><span><input type="number" step="any" id="tn-${k}"><button class="b" data-tn="${k}">적용</button></span></div>`).join('')}
function renderDec(list){
 $('#dl').innerHTML=list.length?list.map(d=>{
  const open=d.status==='open'||d.status==='redo';
  return `<div class="card"><b>${esc(d.summary||d.id)}</b> <span class="tag">${d.status}</span>
  <div class="mut">${esc(d.finding||'')} ${d.scope?.length?'· 범위 '+esc(d.scope.join(', ')):''}</div>
  ${d.why?`<div class="mut">결정 필요 이유: ${esc(d.why)}</div>`:''}
  ${(d.options||[]).map(o=>`<div class="opt"><b>${esc(o.key)}. ${esc(o.name)}</b><div class="pro">+ ${esc(o.pros)}</div><div class="con">- ${esc(o.cons)}</div>
   ${open?`<button class="b p" data-dc="${esc(d.id)}" data-ch="${esc(o.key)}">이 안으로 진행</button>`:''}</div>`).join('')}
  <div class="mut">추천: ${esc(d.recommendation||'-')}</div>
  ${open?`<button class="b" data-dc="${esc(d.id)}" data-ch="redo">다른 제안 받기</button>`:`<div class="mut">선택: ${esc(d.choice||'-')}</div>`}</div>`}).join(''):'<div class="card mut">결정함이 비어 있음</div>'}
async function load(){
 const [o,d,l,t,tv]=await Promise.all([api('/api/overview'),api('/api/decisions'),api('/api/log'),api('/api/timers'),api('/api/tunables')]);
 if(o.state)renderNow(o);
 if(Array.isArray(d))renderDec(d);
 if(Array.isArray(l))$('#log').textContent=l.slice(-30).join('\n');
 if(t&&typeof t==='object'){timers=t;renderTimers()}
 if(tv&&!typing)for(const[k,v]of Object.entries(tv)){const e=$('#tn-'+k);if(e&&document.activeElement!==e&&!e.value)e.value=v}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.t){tab=t.dataset.t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===t));
  for(const k of['now','ctl','dec','rev'])$('#t-'+k).classList.toggle('hid',k!==tab);return}
 let r;
 if(t.dataset.a){if(t.dataset.a==='stop'&&!confirm('즉시 중지할까요? 실행 중 프로세스를 종료합니다.'))return;r=await api('/api/control',{action:t.dataset.a})}
 else if(t.dataset.iv){r=await api('/api/interval',{timer:t.dataset.iv,minutes:Number($('#iv-'+t.dataset.iv).value)})}
 else if(t.dataset.tn){r=await api('/api/tunables',{values:{[t.dataset.tn]:Number($('#tn-'+t.dataset.tn).value)}})}
 else if(t.dataset.dc){r=await api('/api/decisions/'+t.dataset.dc,{choice:t.dataset.ch})}
 else return;
 if(r&&r.ok)toast('적용됨');load()});
document.addEventListener('focusin',e=>{typing=e.target.tagName==='INPUT'});
buildSettings();load();
setInterval(()=>{if(!typing)load()},15000);setInterval(tickTimers,1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
