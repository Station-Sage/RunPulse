<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/console.css">
<title>오토파일럿 관제</title>
</head><body>
<header><h1>오토파일럿 관제</h1><span class="mut" id="upd">-</span></header>
<div id="msg"></div>
<main>
<section id="t-now">
 <div class="card"><div class="hd"><span class="sx"><span class="dot" id="dot"></span><b id="flags">-</b></span>
  <span><button class="b p" data-a="start">시작</button><button class="b p" data-a="resume">재개</button><button class="b" data-a="pause">일시중지</button><button class="b d" data-a="stop">중지</button></span></div>
  <div class="mut">일시중지 = 현재 단계 후 멈춤 · 중지 = 즉시 종료</div></div>
 <div class="card" id="pw" style="display:none"></div>
 <div class="card" id="st"></div>
 <div class="card" id="rel"></div>
 <div class="card" id="bu"></div>
 <div id="bk" class="hid"></div>
 <details class="cfg"><summary>설정·제어</summary>
  <div class="card" id="qu"></div>
  <div class="card" id="roles"></div>
  <div class="card"><b>자동 실행 타이머</b> <span class="mut">(상태 확인용)</span><div id="tm"></div></div>
  <div class="card"><b>한도 설정</b><div id="tgl"></div><div class="fm" id="tun"></div></div>
 </details>
</section>
<section id="t-log" class="hid"><div class="card"><b>진행 로그</b> <span class="mut" id="logst">실시간</span><pre id="log"></pre></div></section>
<section id="t-items" class="hid"><div class="card" id="ih"></div><div id="il"></div></section>
<section id="t-dec" class="hid"><div id="dl"></div></section>
<section id="t-rev" class="hid"><div id="rv"></div></section>
</main>
<nav><button data-t="now" class="on">상황판</button><button data-t="log">로그</button><button data-t="items">개발항목</button><button data-t="dec">결정<span id="dn" class="badge hid"></span></button><button data-t="rev">사후 검토<span id="rn" class="badge hid"></span></button></nav>
<script src="/now.js"></script>
<script src="/app.js"></script>
</body></html>
