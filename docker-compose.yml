services:
  runpulse:
    build: .
    # AI 워커(호스트 ubuntu)와 같은 uid 로 DB/WAL 소유권 일치 (V2-AI-CLAUDE-QUEUE E1)
    user: "1001:1001"
    ports:
      - "80:18080"
    volumes:
      # 소스코드 전체 마운트 (code-server에서 편집 → 즉시 반영)
      - .:/app
      # 호스트 .venv가 컨테이너 패키지를 덮어쓰지 않도록 익명 볼륨으로 격리
      - /app/.venv
    env_file:
      - .env                  # VPS에만 존재, git 제외됨 (.gitignore)
    environment:
    - PYTHONUNBUFFERED=1
    - TZ=Asia/Seoul
    restart: unless-stopped
